<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive-Login-Lamp💡</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="particles particle1"></div>
        <div class="particles particle2"></div>
        <div class="particles particle3"></div>
        <div class="particles particle4"></div>
        <div class="particles particle5"></div>
        <div class="particles particle6"></div>
        <div class="particles particle7"></div>
        <div class="particles particle8"></div>
        <div class="particles particle9"></div>
        <div class="particles particle10"></div>
        <div class="welcome-panel">
            <h2>Welcome Back</h2>
            <h3>Enter your details to access your account</h3> 
            <div>
                <input type="text" placeholder="👤 Username" required> 
            </div>
            <div>
                <input type="email" placeholder="✉️ Email Address" required>
            </div>
            <div>
                <input type="password" placeholder="🔒 Password" required>
            </div>
            <button>Sign In</button>
            <h3>OR CONTINUE WITH</h3>
            <span>
                <button>🌐 Google</button>
                <button>🧑‍💻 GitHub</button>
            </span>
        </div>
        <div class="lamp-container">
            <div class="stand"></div>
            <div class="base"></div>
            <div class="top"></div>
            <div class="wire"></div>
            <div class="pull-wire"></div>
            <div class="shade"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
